{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h2 style="margin-bottom:6px">Ingresar</h2>
  <p class="subtitle" style="margin-bottom:18px">Entrá con tu email y contraseña.</p>
  <form method="post">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" style="width:100%">Ingresar</button>
  </form>
  <p class="subtitle" style="margin-top:14px; font-size:13px">¿No tenés cuenta? <a href="{{ url_for('signup') }}">Creála acá</a>.</p>
</div>
{% endblock %}
